apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: smartbancs
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: smartbancs
            - name: POSTGRES_USER
              value: smartbancs
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: smartbancs-secrets, key: postgres-password}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: postgres-data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: smartbancs}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: smartbancs}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: smartbancs}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
