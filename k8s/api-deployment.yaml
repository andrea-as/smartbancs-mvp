apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartbancs-api
  namespace: smartbancs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartbancs-api
  template:
    metadata:
      labels:
        app: smartbancs-api
    spec:
      containers:
        - name: api
          image: smartbancs/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartbancs-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smartbancs-secrets
                  key: redis-url
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: smartbancs-api
  namespace: smartbancs
spec:
  selector:
    app: smartbancs-api
  ports:
    - port: 80
      targetPort: 8000
