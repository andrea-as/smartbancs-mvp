services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbancs
      POSTGRES_USER: smartbancs
      POSTGRES_PASSWORD: smartbancs_dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbancs -d smartbancs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://smartbancs:smartbancs_dev@db:5432/smartbancs
      REDIS_URL: redis://redis:6379/0
      AI_QUEUE: smartbancs:ai
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  ai:
    build: ./services/ai
    environment:
      REDIS_URL: redis://redis:6379/0
      AI_QUEUE: smartbancs:ai
      DATABASE_URL: postgresql+asyncpg://smartbancs:smartbancs_dev@db:5432/smartbancs
    ports: ["8001:8001"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api, ai]

volumes:
  postgres_data:
